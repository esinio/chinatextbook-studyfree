name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_HUB_USERNAME: 'esinio'
  IMAGE_NAME: 'chinatextbook-studyfree'
  ASSETS_RELEASE: 'v1.8.3'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出你自己的仓库（仅用于获取 workflow 文件，实际源码在下一步克隆）
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      # 2. 释放磁盘空间（原项目构建需下载约 2GB 资源并转码，空间紧张）
      - name: Free Disk Space (Ubuntu)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      # 3. 克隆远程的实际程序代码仓库
      - name: Clone source repository
        run: |
          git clone --branch main https://github.com/wuwangzhang1216/ChinaTextbookStudyFree.git source-code
          cd source-code
          # 验证 Dockerfile 存在，确保后续构建不会空跑
          ls -la Dockerfile compose.yaml

      # 4. 设置 Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. 登录 Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. 提取元数据
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.ASSETS_RELEASE }}

      # 7. 构建并推送（注意 context 指向克隆下来的 source-code 目录）
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./source-code
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ASSETS_RELEASE=${{ env.ASSETS_RELEASE }}
          # 启用 GitHub Actions 缓存，避免每次重新下载 2GB 资源
          cache-from: type=gha
          cache-to: type=gha,mode=max
