name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_HUB_USERNAME: 'esinio'
  IMAGE_NAME: 'chinatextbook-studyfree'
  ASSETS_RELEASE: 'v1.8.3'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出你的仓库
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      # 2. 深度清理磁盘空间 (替换为你原来的简单 rm 命令)
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true # 保留工具缓存，以免后续步骤变慢 # 必须设置 tool-cache 为 true，才能释放出 20GB+ 空间
          android: true     # 删除 Android SDK (~8GB)
          dotnet: true      # 删除 .NET (~2GB)
          haskell: true     # 删除 Haskell (~5GB)
          large-packages: true # 删除大型非必要包
          swap-storage: true   # 删除 swap 存储 (~4GB)，构建大项目必备

      # 3. 克隆实际程序代码仓库
      - name: Clone source repository
        run: |
          git clone --branch main https://github.com/wuwangzhang1216/ChinaTextbookStudyFree.git source-code
          cd source-code
          ls -la Dockerfile compose.yaml

      # 4. 设置 Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. 登录 Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. 提取元数据
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.ASSETS_RELEASE }}

      # 7. 构建并推送 Docker 镜像
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./source-code
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ASSETS_RELEASE=${{ env.ASSETS_RELEASE }}
          # 注意：将 mode=max 改为 mode=min 或者直接删掉 cache-to
          # mode=min 只缓存最终的镜像层，不会爆掉磁盘
          # cache-from: type=gha
          # cache-to: type=gha,mode=min
